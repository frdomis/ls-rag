<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>河南专升本政策问答</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 860px; margin: 0 auto; padding: 24px 20px 110px;
    background: #f5f6f8; color: #1a1a1a; line-height: 1.7;
  }
  header { text-align: center; margin-bottom: 6px; }
  h1 { font-size: 27px; margin: 0 0 6px; letter-spacing: .5px; }
  .sub { color: #888; font-size: 13px; }
  .sub a { color: #1a73e8; text-decoration: none; }

  .ability {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 14px 18px; margin: 18px 0; font-size: 13.5px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .ability h3 { margin: 0 0 8px; font-size: 14px; color: #1f2937; }
  .ability .row { display: flex; gap: 10px; margin: 7px 0; align-items: flex-start; }
  .ability .tag {
    flex: 0 0 auto; font-size: 12px; padding: 1px 9px; border-radius: 10px;
    font-weight: 600; margin-top: 2px;
  }
  .tag.yes { background: #e6f4ea; color: #137333; }
  .tag.no  { background: #fce8e6; color: #c5221f; }
  .ability .list { color: #4b5563; }

  #chat { min-height: 160px; margin-bottom: 16px; }
  .turn { margin-bottom: 18px; }
  .q {
    background: #1a73e8; color: #fff; padding: 10px 14px;
    border-radius: 14px 14px 4px 14px; display: inline-block;
    max-width: 85%; float: right; clear: both; margin-bottom: 10px;
    word-break: break-word;
  }
  .q::after { content: ""; display: block; clear: both; }

  .a {
    background: #fff; padding: 14px 16px; border-radius: 14px 14px 14px 4px;
    border: 1px solid #e5e7eb; clear: both; margin-top: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04); position: relative;
  }
  .a.refused { background: #fff8e6; border: 1px solid #f5c26b; }
  .a.refused::before {
    content: "⚠ 未找到答案";
    position: absolute; top: -10px; left: 14px;
    background: #f5c26b; color: #7a4a00; font-size: 11.5px; font-weight: 600;
    padding: 1px 9px; border-radius: 8px;
  }
  .a .md p { margin: .5em 0; }
  .a .md strong { color: #1a73e8; }
  .a .md ul, .a .md ol { margin: .5em 0; padding-left: 1.4em; }
  .a .md code { background: #f0f2f5; padding: 1px 5px; border-radius: 3px; font-size: .92em; }

  .status {
    display: flex; align-items: center; gap: 8px;
    color: #888; font-size: 13px; margin-bottom: 8px;
  }
  .spinner {
    width: 13px; height: 13px; border: 2px solid #d0d5dd;
    border-top-color: #1a73e8; border-radius: 50%;
    animation: spin .8s linear infinite; flex: 0 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status.done .spinner { display: none; }

  .cursor {
    display: inline-block; width: 2px; height: 1.05em;
    background: #1a73e8; vertical-align: text-bottom;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .sources { margin-top: 12px; border-top: 1px dashed #e5e7eb; padding-top: 10px; }
  .sources summary {
    cursor: pointer; color: #1a73e8; font-size: 13px; user-select: none; font-weight: 500;
  }
  .src {
    background: #fafbfc; border: 1px solid #eef0f3; border-radius: 8px;
    padding: 10px 12px; margin-top: 8px; font-size: 12.5px;
  }
  .src .hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
  .src .idx {
    background: #1a73e8; color: #fff; font-size: 11.5px; font-weight: 700;
    padding: 0 7px; border-radius: 6px; flex: 0 0 auto;
  }
  .src .meta { color: #6b7280; font-size: 11.5px; }
  .src .cid {
    font-family: ui-monospace, Consolas, monospace; color: #9ca3af; font-size: 11px;
    cursor: help; border-bottom: 1px dotted #d1d5db;
  }
  .src .snip { color: #374151; line-height: 1.6; white-space: pre-wrap; }
  .src .more { color: #1a73e8; cursor: pointer; font-size: 12px; display: inline-block; margin-top: 4px; }

  .input-area {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(245,246,248,.96); backdrop-filter: blur(6px);
    padding: 12px 20px; border-top: 1px solid #e5e7eb;
  }
  .input-inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  #q {
    flex: 1; padding: 12px 14px; font-size: 15px;
    border: 1px solid #d0d5dd; border-radius: 10px; outline: none;
  }
  #q:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
  #send {
    padding: 12px 24px; font-size: 15px; cursor: pointer; background: #1a73e8;
    color: #fff; border: none; border-radius: 10px; font-weight: 500;
  }
  #send:disabled { background: #a8c7fa; cursor: not-allowed; }

  .tools { display: flex; gap: 14px; align-items: center; font-size: 13px; color: #6b7280; margin-bottom: 10px; }
  .tools label { cursor: pointer; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .examples button {
    background: #fff; border: 1px solid #d0d5dd; border-radius: 16px;
    padding: 6px 13px; font-size: 12.5px; cursor: pointer; color: #374151;
  }
  .examples button:hover { border-color: #1a73e8; color: #1a73e8; }
</style>
</head>
<body>

<header>
  <h1>河南专升本政策问答</h1>
  <div class="sub">
    流式输出 · <a href="/docs" target="_blank">API 文档</a> ·
    <a href="/health" target="_blank">健康检查</a>
  </div>
</header>

<div class="ability">
  <h3>我能回答什么？</h3>
  <div class="row">
    <span class="tag yes">会答</span>
    <span class="list">报名时间、考试科目、录取规则、投档方式、志愿填报流程、免试政策、学费标准、专业代号、录取控制分数线</span>
  </div>
  <div class="row">
    <span class="tag no">不答</span>
    <span class="list">备考方法（怎么提分）、院校选择建议、生活信息（住宿/自习室）、个人决策（要不要复读）、未来预测（分数线会不会涨）</span>
  </div>
  <div class="row">
    <span class="tag no">暂缺</span>
    <span class="list">院校投档线（"XX 分能上公办吗"）、专业对照表（"我能报什么专业"）、各校招生计划</span>
  </div>
</div>

<div class="tools">
  <label><input type="radio" name="mode" value="fast" checked> fast（快）</label>
  <label><input type="radio" name="mode" value="high"> high（准，+rerank）</label>
</div>

<div class="examples">
  <button onclick="ask('河南专升本考试考哪几科？')">考哪几科</button>
  <button onclick="ask('2026年河南专升本录取控制分数线是多少？')">分数线</button>
  <button onclick="ask('免试是不是不用考试啊，资格审核严不严，有过来人吗？')">免试要不要考试</button>
  <button onclick="ask('我要怎么填报志愿')">怎么填志愿</button>
  <button onclick="ask('跨专业报考审核要交什么材料？')">跨专业材料（暂缺）</button>
</div>

<div id="chat"></div>

<div class="input-area">
  <div class="input-inner">
    <input id="q" type="text" placeholder="输入你的问题，例如：2026年报名时间？" autocomplete="off">
    <button id="send">发送</button>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const qEl = document.getElementById('q');
const sendBtn = document.getElementById('send');
let busy = false;

function render(md, target) {
  if (window.marked) target.innerHTML = marked.parse(md);
  else target.textContent = md;
}
function getMode() {
  return document.querySelector('input[name=mode]:checked').value;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function scrollBottom() {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

async function ask(question) {
  if (busy || !question) return;
  busy = true;
  sendBtn.disabled = true;
  qEl.value = '';

  const turn = el('div', 'turn');
  turn.appendChild(el('div', 'q', question));

  const ab = el('div', 'a');
  const status = el('div', 'status');
  status.appendChild(el('div', 'spinner'));
  const statusText = el('span', null, '正在检索知识库…');
  status.appendChild(statusText);
  ab.appendChild(status);

  const md = el('div', 'md');
  ab.appendChild(md);
  turn.appendChild(ab);
  chatEl.appendChild(turn);
  scrollBottom();

  let full = '';
  let firstTokenShown = false;
  let cursor = null;
  const t0 = performance.now();

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
      body: JSON.stringify({ question, mode: getMode() })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);

        let ev = 'message', data = '';
        for (const line of raw.split('\n')) {
          if (line.startsWith('event:')) ev = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (!data) continue;

        let obj;
        try { obj = JSON.parse(data); } catch { continue; }
        const now = Math.round(performance.now() - t0);

        if (ev === 'meta') {
          const n = (obj.sources || []).length;
          statusText.textContent = '已检索 ' + n + ' 条来源（' + (obj.meta_ms || obj.retrieve_ms) + 'ms）· 正在生成答案…';
          renderSources(ab, obj.sources);
          scrollBottom();

        } else if (ev === 'token') {
          if (!firstTokenShown) {
            firstTokenShown = true;
            statusText.textContent = '首字 ' + now + 'ms · 生成中…';
            cursor = el('span', 'cursor');
            md.appendChild(cursor);
          }
          full += obj.text || '';
          render(full, md);
          if (cursor) md.appendChild(cursor);
          scrollBottom();

        } else if (ev === 'done') {
          status.classList.add('done');
          statusText.textContent = '完成 · 首字 ' + (obj.first_token_ms ?? '-') + 'ms · 总 ' +
            (obj.total_ms ?? now) + 'ms · ' + (obj.chars ?? full.length) + ' 字';
          if (cursor) cursor.remove();
          if (obj.refused) ab.classList.add('refused');

        } else if (ev === 'error') {
          statusText.textContent = '出错了：' + (obj.message || '未知错误');
          ab.classList.add('refused');
        }
      }
    }
  } catch (e) {
    statusText.textContent = '请求失败：' + e.message;
    ab.classList.add('refused');
  } finally {
    if (cursor) cursor.remove();
    busy = false;
    sendBtn.disabled = false;
    qEl.focus();
  }
}

/* 来源带编号 [1][2]，与答案里的"材料[N]"对应 */
function renderSources(container, sources) {
  if (!sources || !sources.length) return;
  const wrap = el('details', 'sources');
  wrap.appendChild(el('summary', null, '📚 引用来源（' + sources.length + ' 条，点击展开）'));

  sources.forEach(function (s, i) {
    const box = el('div', 'src');

    const hdr = el('div', 'hdr');
    hdr.appendChild(el('span', 'idx', '[' + (i + 1) + ']'));

    const meta = el('div', 'meta');
    meta.appendChild(document.createTextNode(
      (s.source || '-') + ' · ' + (s.doc_type || '-') + ' · ' + (s.year || '-') +
      ' · score ' + s.score + ' · '));
    const cid = el('span', 'cid', s.chunk_id);
    cid.title = '文档块标识（溯源用，可忽略）';
    meta.appendChild(cid);
    hdr.appendChild(meta);
    box.appendChild(hdr);

    const snippet = s.snippet || '';
    const snip = el('div', 'snip', snippet);
    box.appendChild(snip);

    if (s.text && s.text.length > snippet.length + 20) {
      const more = el('span', 'more', '展开全文 ▾');
      more.onclick = function () {
        if (snip.textContent === s.text) {
          snip.textContent = snippet;
          more.textContent = '展开全文 ▾';
        } else {
          snip.textContent = s.text;
          more.textContent = '收起 ▴';
        }
      };
      box.appendChild(more);
    }

    wrap.appendChild(box);
  });
  container.appendChild(wrap);
}

sendBtn.addEventListener('click', function () { ask(qEl.value.trim()); });
qEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.isComposing) ask(qEl.value.trim());
});
</script>
</body>
</html>
